<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex" />
		<title>Forms</title>
	</head>
	<body>
		<form name="touchpoint-session" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="touchpoint-session" />
			<input type="text" name="bot-field" />
			<input type="text" name="name" />
			<input type="email" name="email" />
			<input type="text" name="handle" />
			<input type="text" name="affiliation" />
			<input type="text" name="title" />
			<select name="format">
				<option value="Show and tell">Show and tell</option>
			</select>
			<select name="duration">
				<option value="10 minutes">10 minutes</option>
			</select>
			<textarea name="summary"></textarea>
			<textarea name="tools"></textarea>
			<select name="timing">
				<option value="Any upcoming Touchpoint">Any upcoming Touchpoint</option>
			</select>
			<input type="url" name="link" />
			<input type="checkbox" name="recording" value="yes" />
			<input type="checkbox" name="code-of-conduct" value="yes" />
		</form>
	</body>
</html>
